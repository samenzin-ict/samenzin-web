# Checks every push and pull request, and deploys the two long-lived branches.
#
#   dev   -> Vercel Preview     -> Neon branch `dev`
#   main  -> Vercel Production  -> Neon branch `production`
#
# Vercel's own Git integration is switched off: the Hobby plan does not build
# automatically for a repository owned by an organisation, so an Ignored Build
# Step cancels those builds. This workflow does the deploying instead, which
# also means nothing reaches either environment unless lint, types and the build
# have passed first.
#
# Deliberately no database service. Every public route is force-dynamic and the
# schema is applied by `payload migrate` at deploy time, so the build must
# succeed without PostgreSQL. If that ever stops being true, this job fails
# rather than the deploy.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          # Not a real secret. The build needs the variable to be present, and
          # nothing produced by this job is deployed.
          PAYLOAD_SECRET: ci-build-only-not-a-real-secret
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
          # Never connected to. The build must not need a database, but the
          # config refuses to load without a connection string at all, which is
          # what stops a deploy going out with the variable unset.
          DATABASE_URI: postgres://ci:ci@127.0.0.1:5432/ci

  docker:
    name: Container image builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built but not pushed. Pushing to a registry and deploying over SSH
      # needs the registry, the host and the canonical domain to be decided
      # first; see the open questions in PROGRESS.md.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    # Nothing is deployed unless the checks pass. The container image is not a
    # gate: it exists for self-hosting parity and is not what Vercel runs.
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    # Named so that branch protection or a required reviewer can be added in
    # GitHub later without touching this file.
    environment: ${{ github.ref_name == 'main' && 'production' || 'preview' }}

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      # Fails here with something actionable, rather than fifty lines down
      # inside the Vercel CLI with "Error: No existing credentials found".
      - name: Check the deployment secrets are set
        run: |
          missing=
          [ -n "${{ secrets.VERCEL_TOKEN }}" ] || missing="$missing VERCEL_TOKEN"
          [ -n "${{ secrets.VERCEL_ORG_ID }}" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ] || missing="$missing VERCEL_PROJECT_ID"
          # Vercel's ids have fixed prefixes. Checking them turns "Project not
          # found", which says nothing about which value is wrong, into a
          # message that names it. The values themselves are never printed.
          shape=
          case "${{ secrets.VERCEL_PROJECT_ID }}" in
            prj_*) ;;
            "") ;;
            *) shape="$shape VERCEL_PROJECT_ID(should start with prj_)" ;;
          esac
          # A team id is team_..., a personal one is a bare alphanumeric string.
          # Neither ever contains a hyphen, but the team *slug* does — and the
          # slug from the dashboard URL is the easy thing to copy by mistake.
          case "${{ secrets.VERCEL_ORG_ID }}" in
            "") ;;
            *-*) shape="$shape VERCEL_ORG_ID(looks like a team slug, not an id)" ;;
          esac
          if [ -n "$shape" ]; then
            {
              echo "### Deployment secrets look wrong"
              echo
              echo "Wrong shape:$shape"
              echo
              echo "Both come from \`.vercel/project.json\` after \`vercel link\`:"
              echo "\`orgId\` -> VERCEL_ORG_ID, \`projectId\` -> VERCEL_PROJECT_ID."
              echo "Check they have not been swapped."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Deployment secrets have the wrong shape:$shape" >&2
            exit 1
          fi

          if [ -n "$missing" ]; then
            {
              echo "### Deployment is not configured yet"
              echo
              echo "Missing repository secrets:$missing"
              echo
              echo "Add them under Settings -> Secrets and variables -> Actions."
              echo "VERCEL_ORG_ID and VERCEL_PROJECT_ID come from .vercel/project.json"
              echo "after running \`vercel link\`; the token comes from your Vercel"
              echo "account settings. See docs/environments.md."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Missing repository secrets:$missing" >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Installed with npm, not pnpm. pnpm/action-setup does not configure a
      # global bin directory on the runner, so `pnpm add -g` installs the
      # binary somewhere that is not on PATH and the next step cannot find it.
      - name: Install the Vercel CLI
        run: npm install -g vercel@latest

      # Which Vercel environment this branch belongs to. Everything below reads
      # these two, so the mapping is stated once.
      - name: Choose the target
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      # Says which account the token authenticates as and which teams it can
      # reach. "Could not retrieve Project Settings" from the next step means
      # the token cannot see the team that owns the project, and Vercel's error
      # does not say so; this does.
      - name: Check the token can reach the team
        run: |
          echo "Authenticated as:"
          vercel whoami --token=${{ secrets.VERCEL_TOKEN }}
          echo
          echo "Teams this token can see:"
          vercel teams ls --token=${{ secrets.VERCEL_TOKEN }}

      # Fetches that environment's variables, including the DATABASE_URI that
      # decides which Neon branch this deployment talks to. They are set in the
      # Vercel dashboard, per environment, and are never read from the repo.
      - name: Pull the environment
        run: vercel pull --yes --environment=${{ steps.target.outputs.environment }} --token=${{ secrets.VERCEL_TOKEN }}

      # Builds on this runner rather than on Vercel. The build runs the
      # `vercel-build` script, which applies pending migrations to that
      # environment's database before compiling, so the deployment never goes
      # out ahead of its own schema. A failing migration fails the build and
      # nothing is promoted.
      - name: Build
        run: vercel build ${{ steps.target.outputs.flag }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          # The CLI prints progress as well as the URL; the URL is the last line.
          url=$(vercel deploy --prebuilt ${{ steps.target.outputs.flag }} --token=${{ secrets.VERCEL_TOKEN }} | tail -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed ${{ github.ref_name }} to ${{ steps.target.outputs.environment }}: $url"

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Target | ${{ steps.target.outputs.environment }} |"
            echo "| URL | ${{ steps.deploy.outputs.url }} |"
          } >> "$GITHUB_STEP_SUMMARY"
